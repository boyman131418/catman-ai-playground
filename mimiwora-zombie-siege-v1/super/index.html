<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#05080d"><title>MIMIWORA：末鐘守城</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#05080d;color:#fff;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;overflow:hidden}body{display:grid;place-items:center}#wrap{width:min(100vw,1280px);padding:8px}#box{position:relative;aspect-ratio:16/9;border:4px solid #d8ca92;background:#000;box-shadow:0 20px 70px #000d}canvas{width:100%;height:100%;display:block;image-rendering:pixelated}#tip{position:absolute;top:7px;left:12px;font-size:10px;color:#fff8;pointer-events:none}#mobileControls{position:absolute;inset:0;pointer-events:none;display:none;z-index:8}.pad{position:absolute;bottom:max(10px,env(safe-area-inset-bottom));display:flex;gap:8px;pointer-events:auto}.pad.left{left:max(10px,env(safe-area-inset-left))}.pad.right{right:max(10px,env(safe-area-inset-right))}.touchBtn{min-width:54px;height:54px;padding:0 11px;border:2px solid #ffffff99;border-radius:14px;background:#07101dd8;color:#fff;font:700 14px monospace;display:grid;place-items:center;user-select:none;touch-action:manipulation;box-shadow:0 4px 0 #0009}.touchBtn.wide{min-width:88px}#errorBox{position:absolute;inset:0;display:none;place-items:center;background:#16090ce8;color:#ffd7dd;z-index:30;padding:30px;text-align:center;white-space:pre-wrap}@media(pointer:coarse),(max-width:900px){#mobileControls{display:block}#tip{display:none}#wrap{width:100vw;padding:0}#box{border:0;width:100vw;height:100svh;aspect-ratio:auto}canvas{width:100vw;height:100svh;object-fit:contain;background:#05080d}}@media(orientation:portrait) and (max-width:900px){#box::before{content:"建議橫向玩";position:absolute;top:max(7px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:9;padding:6px 10px;border-radius:8px;background:#000b;color:#ffe889;font:12px monospace;pointer-events:none}}</style></head><body><div id="wrap"><div id="box"><canvas id="c" width="960" height="540"></canvas><div id="tip">Enter 確認｜升級 1 / 2 / 3｜Q 合技｜M 靜音｜關卡前可更換武器</div><div id="mobileControls"><div class="pad left" id="skillPad"><button class="touchBtn" data-code="Digit1">1</button><button class="touchBtn" data-code="Digit2">2</button><button class="touchBtn" data-code="Digit3">3</button></div><div class="pad right"><button class="touchBtn wide" data-code="Enter">ENTER</button><button class="touchBtn" data-code="KeyQ">Q</button><button class="touchBtn" data-code="KeyM">🔊</button></div></div><div id="errorBox"></div></div></div><script>window.addEventListener("error",e=>{const b=document.getElementById("errorBox");b.style.display="grid";b.textContent="遊戲載入出錯\n"+(e.message||e.error||"Unknown error")});</script><script src="../mimi-1.js"></script><script src="../mimi-2.js"></script><script src="../mimi-3.js"></script><script src="../goban-1.js"></script><script src="../goban-2.js"></script><script src="../goban-3.js"></script><script src="../nomo-1.js"></script><script src="../nomo-2.js"></script><script src="../kuro-1.js"></script><script src="../kuro-2.js"></script><script src="../kuro-3.js"></script><script>(function(){const raw=window.__MIMI_RAW||{};window.MIMIWORA_SPRITES={};for(const k of ["mimi","goban","nomo","kuro"]){if(!raw[k])throw new Error("Missing sprite asset: "+k);window.MIMIWORA_SPRITES[k]="data:image/png;base64,"+raw[k]}})();</script><script src="./super.js"></script></body></html>
