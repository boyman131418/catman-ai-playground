indow.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const gate=document.getElementById('authGate'),loginBtn=document.getElementById('googleLoginBtn'),guestBtn=document.getElementById('guestBtn'),msg=document.getElementById('authMsg'),badge=document.getElementById('accountBadge'),avatar=document.getElementById('accountAvatar'),nameEl=document.getElementById('accountName'),logoutBtn=document.getElementById('logoutBtn'),toast=document.getElementById('cloudToast');let cloudUser=null,saving=false;function toastMsg(t){toast.textContent=t;toast.style.display='block';clearTimeout(toast._t);toast._t=setTimeout(()=>toast.style.display='none',1500)}function showUser(user){cloudUser=user||null;if(user){gate.style.display='none';badge.style.display='flex';const m=user.user_metadata||{};nameEl.textContent=m.full_name||m.name||user.email||'Player';if(m.avatar_url){avatar.src=m.avatar_url;avatar.style.display='block'}else avatar.style.display='none'}else badge.style.display='none'}async function saveNow(){if(!cloudUser||saving)return;saving=true;try{const {error}=await sb.from('game_saves').upsert({user_id:cloudUser.id,save_version:2,save_data:save,updated_at:new Date().toISOString()},{onConflict:'user_id'});if(error)throw error;toastMsg('☁ 已同步')}catch(e){console.error(e);toastMsg('雲端儲存失敗')}finally{saving=false}}async function loadCloud(){if(!cloudUser)return;try{const {data,error}=await sb.from('game_saves').select('save_data').eq('user_id',cloudUser.id).maybeSingle();if(error)throw error;const remote=data&&data.save_data&&Object.keys(data.save_data).length?data.save_data:null;if(remote){Object.assign(save,defaultSave(),remote);localStorage.setItem(SAVE_KEY,JSON.stringify(save));toastMsg('☁ 已載入雲端進度')}else await saveNow()}catch(e){console.error(e);toastMsg('雲端讀檔失敗')}}const originalStore=store;store=function(){originalStore();saveNow()};loginBtn.onclick=async()=>{msg.textContent='正在開啟 Google 登入…';const {er
