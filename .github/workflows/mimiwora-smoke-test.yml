name: MIMIWORA Production Smoke Test

on:
  workflow_run:
    workflows: ["Deploy to GitHub Pages"]
    types: [completed]

permissions:
  contents: read

jobs:
  smoke:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Test live mobile game
        env:
          GAME_URL: https://boyman131418.github.io/catman-ai-playground/mimiwora/
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage({viewport:{width:390,height:844}, deviceScaleFactor:1});
            const fatal=[];
            page.on('pageerror', e=>fatal.push('pageerror: '+e.message));
            page.on('console', m=>{ if(m.type()==='error') fatal.push('console: '+m.text()); });
            const url=process.env.GAME_URL+'?smoke='+Date.now();
            const resp=await page.goto(url,{waitUntil:'domcontentloaded',timeout:60000});
            if(!resp || resp.status()!==200) throw new Error('HTTP status '+(resp&&resp.status()));
            await page.waitForSelector('#authGate',{state:'visible',timeout:30000});
            await page.waitForSelector('#googleLoginBtn',{state:'visible'});
            await page.waitForSelector('#guestBtn',{state:'visible'});
            const title=await page.title();
            if(!title.includes('MIMIWORA')) throw new Error('Wrong title: '+title);
            await page.waitForFunction(()=>window.MIMIWORA_ROSTER&&window.MIMIWORA_ROSTER.all.length===7,{timeout:30000});
            const boot=await page.evaluate(()=>({
              sprites:Object.keys(window.MIMIWORA_SPRITES||{}).length,
              roster:window.MIMIWORA_ROSTER?.all?.slice()||[],
              canvas:[document.getElementById('c').width,document.getElementById('c').height],
              err:getComputedStyle(document.getElementById('err')).display,
              trio:['chiikawa','hachiware','usagi'].map(k=>({k,name:HERO_BASE[k]?.name,weapons:WEAPONS[k]?.length||0}))
            }));
            if(boot.sprites<7) throw new Error('Expected at least 7 sprite packs, got '+boot.sprites);
            if(boot.roster.length!==7) throw new Error('Expected 7 roster entries, got '+boot.roster.length);
            if(boot.canvas[0]!==540 || boot.canvas[1]!==960) throw new Error('Canvas is not 9:16: '+boot.canvas);
            if(boot.err!=='none') throw new Error('Error overlay visible before start');
            if(boot.trio.some(x=>x.weapons!==4||!x.name)) throw new Error('Chiikawa trio definitions incomplete: '+JSON.stringify(boot.trio));

            await page.click('#guestBtn');
            await page.waitForTimeout(700);
            const afterGuest=await page.evaluate(()=>{
              const c=document.getElementById('c'),d=c.getContext('2d').getImageData(0,0,c.width,c.height).data;
              let nonBlack=0;
              for(let i=0;i<d.length;i+=4096){if(d[i]+d[i+1]+d[i+2]>18 && d[i+3]>0) nonBlack++;}
              return {nonBlack,mode:game.mode,gate:getComputedStyle(document.getElementById('authGate')).display,err:getComputedStyle(document.getElementById('err')).display};
            });
            if(afterGuest.gate!=='none') throw new Error('Guest gate did not close');
            if(afterGuest.nonBlack<8) throw new Error('Canvas appears blank: '+afterGuest.nonBlack);
            if(afterGuest.err!=='none') throw new Error('Error overlay visible after guest start');

            await page.evaluate(()=>{save.seen=true;game.mode='map';});
            const box=await page.locator('#c').boundingBox();
            await page.mouse.click(box.x+box.width*.5,box.y+box.height*.18);
            await page.waitForTimeout(350);
            const partyMode=await page.evaluate(()=>game.mode);
            if(partyMode!=='party') throw new Error('Stage click did not open party select, mode='+partyMode);

            const partyCheck=await page.evaluate(()=>{
              const picked=window.__MIMIWORA_TEST__.party(['chiikawa','hachiware','usagi','mimi']);
              game.stageId=1;game.mode='loadout';
              return {picked,saveParty:save.party.slice(),selected:game.selectedHero};
            });
            if(JSON.stringify(partyCheck.picked)!==JSON.stringify(['chiikawa','hachiware','usagi','mimi'])) throw new Error('Party API failed '+JSON.stringify(partyCheck));
            await page.evaluate(()=>{window.__MIMIWORA_TEST__.start(1);window.__MIMIWORA_TEST__.skipStory();});
            await page.waitForTimeout(800);
            const battle=await page.evaluate(()=>({mode:game.mode,heroes:Object.keys(game.heroes),types:TYPES.slice(),hp:game.gateHP}));
            if(battle.mode!=='battle') throw new Error('Could not enter battle: '+JSON.stringify(battle));
            if(battle.heroes.length!==4 || !battle.heroes.includes('chiikawa') || !battle.heroes.includes('hachiware') || !battle.heroes.includes('usagi')) throw new Error('New party missing in battle: '+JSON.stringify(battle));
            if(fatal.length) throw new Error('Browser errors: '+fatal.join(' | '));
            console.log('ROSTER_SMOKE_OK',JSON.stringify({title,boot,afterGuest,partyCheck,battle}));

            // Verify Google OAuth can at least start. We do not submit credentials.
            const p2=await browser.newPage({viewport:{width:390,height:844}});
            await p2.goto(url,{waitUntil:'domcontentloaded',timeout:60000});
            await p2.waitForSelector('#googleLoginBtn',{state:'visible',timeout:30000});
            await p2.click('#googleLoginBtn');
            await p2.waitForTimeout(4500);
            const oauth={url:p2.url(),msg:await p2.locator('#authMsg').textContent().catch(()=>'' )};
            console.log('OAUTH_START',JSON.stringify(oauth));
            if(!/accounts\.google\.com|supabase\.co\/auth\/v1\/authorize/.test(oauth.url)){
              if(oauth.msg) throw new Error('Google OAuth did not start: '+oauth.msg);
              throw new Error('Google OAuth did not navigate: '+oauth.url);
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
