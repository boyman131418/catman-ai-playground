name: PianoForge endpoint v7

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/pianoforge-endpoint-v7.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-endpoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Point PianoForge frontend to live Vercel backend
        run: |
          python - <<'PY'
          from pathlib import Path
          old='https://pianoforge-ai-api.vercel.app/api/analyze-score'
          new='https://pianoforge-five-level-piano.vercel.app/api/analyze-score'
          changed=[]
          for rel in ['public/pianoforge/pianoforge-pro.js','public/pianoforge/ai-vision.js']:
              p=Path(rel)
              if not p.exists():
                  continue
              s=p.read_text()
              if old in s:
                  p.write_text(s.replace(old,new))
                  changed.append(rel)
          print('patched', changed)
          PY
      - name: Commit endpoint update
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/pianoforge/pianoforge-pro.js public/pianoforge/ai-vision.js
          git commit -m "Point PianoForge AI to production Vercel backend"
          git push
