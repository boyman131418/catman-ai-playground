name: PianoForge AI Vision patch

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-pianoforge-ai:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add AI Vision client script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('public/pianoforge/index.html')
          s=p.read_text()
          tag='<script src="./ai-vision.js?v=5"></script>'
          if tag not in s:
              s=s.replace('</body></html>',tag+'</body></html>')
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/pianoforge/index.html
          git commit -m "Enable PianoForge AI Vision UI"
          git push
