name: PianoForge interactive score patch

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/pianoforge-interactive-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Attach interactive score layer
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('public/pianoforge/index.html')
          s=p.read_text()
          tag='<script src="./interactive.js?v=3"></script>'
          if tag not in s:
              s=s.replace('</body>', tag+'</body>')
              p.write_text(s)
          PY
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/pianoforge/index.html
          git commit -m "Enable PianoForge interactive score feedback"
          git push
