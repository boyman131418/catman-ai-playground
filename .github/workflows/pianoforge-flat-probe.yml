name: PianoForge Flat OMR probe

on:
  push:
    paths:
      - '.github/workflows/pianoforge-flat-probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Vercel production deploy
        run: sleep 45
      - name: Probe Flat OMR via production backend
        run: |
          set -e
          curl -sS -D /tmp/h -o /tmp/b https://pianoforge-five-level-piano.vercel.app/api/flat-probe
          echo '--- headers ---'
          cat /tmp/h
          echo '--- body ---'
          cat /tmp/b
          echo
