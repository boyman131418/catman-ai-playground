name: PianoForge image upload fix

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-pianoforge:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch PianoForge image workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('public/pianoforge/index.html')
          s=p.read_text()
          old='''<section class="upload"><b>01 · 上傳 / 讀取音樂</b><div class="drop"><div><strong id="fname">拖放檔案或選擇檔案</strong><div class="muted">MusicXML / MIDI 完整支援；MP3/WAV/M4A 為旋律追蹤 Beta；PDF/JPG 需雲端 OMR。</div><div class="pills"><span class="pill">MusicXML ✓</span><span class="pill">MIDI ✓</span><span class="pill">Audio Beta</span><span class="pill">Web MIDI</span></div></div><button class="btn gold" onclick="document.querySelector('#file').click()">選擇檔案</button><input id="file" type="file" hidden accept=".musicxml,.xml,.mid,.midi,audio/*,.pdf,image/*"></div><div class="status" id="status">分析中…</div></section>'''
          new='''<section class="upload"><b>01 · 上傳 / 讀取音樂</b><div class="drop"><div><strong id="fname">拖放檔案或選擇檔案</strong><div class="muted">MusicXML 可直接讀取；JPG/PNG 琴譜可用「圖片琴譜 Beta」辨識主旋律，再生成五個程度。</div><div class="pills"><span class="pill">MusicXML ✓</span><span class="pill">圖片琴譜 Beta ✓</span><span class="pill">Web MIDI ✓</span><span class="pill">MIDI / Audio 下一階段</span></div></div><button class="btn gold" onclick="document.querySelector('#file').click()">選擇檔案</button><input id="file" type="file" hidden accept=".musicxml,.xml,.mid,.midi,audio/*,.pdf,image/*"></div><img id="preview" alt="琴譜預覽" style="display:none;margin-top:12px;max-width:100%;max-height:260px;border-radius:12px;border:1px solid #3b3443;background:#fff"><div id="genbar" style="display:none;margin-top:12px;gap:10px;align-items:center;flex-wrap:wrap"><button class="btn gold" id="generate">生成五階琴譜</button><span class="muted">圖片 Beta 目前優先讀取清晰、正面拍攝的五線譜，先抓右手／主旋律。</span></div><div class="status" id="status">分析中…</div></section>'''
          if old in s:
              s=s.replace(old,new)
          s=s.replace('PDF/JPG 樂譜亦需要下一階段接 Optical Music Recognition。','JPG/PNG 已加入圖片琴譜 Beta；複雜雙手、多聲部、連音、裝飾音及升降記號仍會在下一階段接專用 OMR 強化。')
          if './omr.js' not in s:
              s=s.replace('</body></html>','<script src="./omr.js?v=2"></script></body></html>')
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/pianoforge/index.html
          git commit -m "Enable PianoForge image score generation"
          git push
